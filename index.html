:root{--bg:#EEF1F4;--surface:#FFFFFF;--sunk:#E3E8ED;--ink:#1B2430;--muted:#66717F;--line:#D5DCE3;--gain:#1F7A4D;--gain-bg:#E1F1E8;--loss:#B4372B;--loss-bg:#F8E3E0;--hot:#B57F00;--hot-bg:#FBF0D2;--focus:#2F5D9A;--rail:#CBD3DB;--radius-s:6px;--radius-l:14px;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#12171D;--surface:#1A2129;--sunk:#232C36;--ink:#E6EBF0;--muted:#8B96A3;--line:#2C3641;--gain:#4CC38A;--gain-bg:#18342A;--loss:#F0715F;--loss-bg:#3A2220;--hot:#F2B53A;--hot-bg:#3A2F14;--focus:#7FA8E0;--rail:#3A4552}}
.num,.trio b,.grid3 b,td{font-weight:500;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.hero .big{font-weight:600}
.hero{padding:20px 18px 16px}
.hero-day{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:2px 0 4px}
.hero .big{font-size:40px;line-height:1.1;letter-spacing:-.03em}
.hero-pct{font-size:17px}
.hero .trio{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.hero .trio b{font-size:15px}
.attn-note{color:var(--hot);margin-top:2px}
.pos-name{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.pos-result{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.pos-result b{font-size:16px}
.flag{display:inline-block;padding:0 7px;border-radius:var(--radius-s);font-size:12px;font-weight:500}
.flag.up{background:var(--gain-bg);color:var(--gain)}.flag.down{background:var(--loss-bg);color:var(--loss)}
.card.attn.up{box-shadow:inset 3px 0 0 var(--gain),0 1px 2px rgba(27,36,48,.04),0 2px 8px -4px rgba(27,36,48,.08)}
.card.attn.down{box-shadow:inset 3px 0 0 var(--loss),0 1px 2px rgba(27,36,48,.04),0 2px 8px -4px rgba(27,36,48,.08)}
@media (prefers-color-scheme:dark){.card.attn.up{box-shadow:inset 3px 0 0 var(--gain)}.card.attn.down{box-shadow:inset 3px 0 0 var(--loss)}}
@media (prefers-color-scheme:light){.card{border-color:transparent}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:64px 0 calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--focus)}
header{position:fixed;inset:0 0 auto 0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
.bar h1{font-size:17px;font-weight:600;margin:0}
.bar .btn{height:38px;min-height:0;display:inline-flex;align-items:center;padding-top:0;padding-bottom:0}.icon-btn{justify-content:center;width:40px;padding:0}.icon-btn svg{width:20px;height:20px}
.bar .when{color:var(--muted);font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:640px;margin:0 auto;padding:16px}
nav{position:fixed;inset:auto 0 0 0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;padding:12px 2px;color:var(--muted);font-weight:500;font-size:14px;cursor:pointer;min-height:48px}
nav button[aria-current=page]{color:var(--ink);font-weight:600;box-shadow:inset 0 2px 0 var(--focus)}
.count{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--hot-bg);color:var(--hot);font-size:12px;font-weight:600;margin-left:4px}
h2{font-size:14px;font-weight:600;margin:28px 0 10px;color:var(--muted);letter-spacing:.01em}
.card h2,.sheet h2{color:var(--ink)}
h3{font-size:14px;font-weight:600;margin:12px 0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(27,36,48,.04),0 2px 8px -4px rgba(27,36,48,.08)}
@media (prefers-color-scheme:dark){.card{box-shadow:none}}
.muted{color:var(--muted)}.small{font-size:13px}.gain{color:var(--gain)}.loss{color:var(--loss)}.hot{color:var(--hot)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.big{font-size:32px;font-weight:600;line-height:1.15;letter-spacing:-.02em}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.trio b{display:block;font-weight:600}
.tag{display:inline-block;padding:0 7px;border-radius:var(--radius-s);font-size:12px;font-weight:500;background:var(--sunk);color:var(--muted);margin-right:4px}
.tag.momentum,.tag.warn{background:var(--hot-bg);color:var(--hot)}.tag.pullback,.tag.ok{background:var(--gain-bg);color:var(--gain)}.tag.bad{background:var(--loss-bg);color:var(--loss)}
.btn{display:inline-block;background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius-s);padding:7px 12px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink);min-height:36px}
.btn{transition:transform .18s cubic-bezier(.16,1,.3,1),background-color .18s,border-color .18s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(1px) scale(.98)}
nav button{transition:color .18s;-webkit-tap-highlight-color:transparent}
nav button:active{transform:scale(.97)}
.btn.primary{background:var(--focus);border-color:var(--focus);color:var(--surface)}
.btn.danger{color:var(--loss)}
.btn.ghost{background:none}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rail{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--loss-bg),var(--rail) 50%,var(--gain-bg));margin:14px 0 6px}
.rail i{position:absolute;top:0;height:6px;border-radius:3px}.rail .gav{top:-4px;width:2px;height:14px;background:var(--ink)}
.rail .dot{top:-5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--surface);border:3px solid var(--muted)}
.rail .dot.up{border-color:var(--gain)}.rail .dot.down{border-color:var(--loss)}

<script>
"use strict";
/* CONSENSUS-LOGIC-START */
const C_STALE_DAYS = 30;
const C_SOURCES = {
  avanza: {label: "Avanza", layer: "analyst", manual: true},
  borsdata_sp: {label: "Börsdata (S&P)", layer: "analyst", manual: true},
  other: {label: "Annan", layer: "analyst", manual: true},
  yahoo: {label: "Yahoo", layer: "analyst", manual: false},
  borsdata_users: {label: "Börsdata-användare", layer: "user", manual: false},
};
const C_CURRENCIES = ["SEK", "EUR", "USD", "NOK", "DKK"];
function apiOverrideAllowed(param, loc) {
  const local = h => h === "localhost" || h === "127.0.0.1";
  try {
    const u = new URL(param);
    return local(loc.hostname) && local(u.hostname) && (u.protocol === "http:" || u.protocol === "https:") && !u.username && !u.password;
  } catch (e) { return false; }
}
function cNum(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).replace(/[\s ]/g, "").replace(",", ".").replace("−", "-");
  if (s === "") return null;
  return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
}
function cDateOk(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || "") && !isNaN(Date.parse(s + "T00:00:00Z")); }
function cPriceCurrency(ticker) { return /\.ST$/i.test(ticker || "") ? "SEK" : "USD"; }
function cNewId(prefix, n) {
  const rand = Math.random().toString(36).slice(2, 2 + n).padEnd(n, "0");
  return `${prefix}_${Date.now().toString(36)}${rand}`;
}
function cRetraction(list, id) { return list.find(r => r.kind === "retraction" && r.retracts === id) || null; }
function cStatus(list, o) {
  if (cRetraction(list, o.id)) return "retracted";
  if (list.some(x => x.kind === "observation" && x.supersedes === o.id)) return "superseded";
  return "active";
}
function cObservations(list, ticker) { return list.filter(o => o.kind === "observation" && o.ticker === ticker); }
function cActive(list, ticker) { return cObservations(list, ticker).filter(o => cStatus(list, o) === "active"); }
function cLatestBySource(list, ticker) {
  const best = {};
  for (const o of cActive(list, ticker)) {
    const k = (o.observed_at || "") + (o.recorded_at || "");
    if (!best[o.source] || k > (best[o.source].observed_at || "") + (best[o.source].recorded_at || "")) best[o.source] = o;
  }
  return best;
}
function cCheckAmend(list, id) {
  const o = list.find(x => x.id === id && x.kind === "observation");
  if (!o) return "Observationen finns inte i filen. Öppna aktien igen.";
  const st = cStatus(list, o);
  if (st !== "active") return `Observationen är redan ${st === "retracted" ? "markerad som fel" : "rättad"}, troligen från en annan enhet. Öppna aktien igen och utgå från den aktuella.`;
  return null;
}
function cAppend(list, rec) {
  if (!rec || !rec.id) throw new Error("Posten saknar id.");
  if (list.some(x => x.id === rec.id)) throw new Error("Posten finns redan (samma id).");
  const amended = rec.kind === "retraction" ? rec.retracts : rec.supersedes;
  if (amended) {
    const problem = cCheckAmend(list, amended);
    if (problem) throw new Error(problem);
  }
  return list.concat([rec]);
}
function cUnchangedPrefix(before, after) {
  if (!Array.isArray(after) || after.length < before.length) return false;
  return before.every((x, i) => JSON.stringify(x) === JSON.stringify(after[i]));
}
function cIsStale(o, today) {
  const days = (Date.parse(today + "T00:00:00Z") - Date.parse(o.observed_at + "T00:00:00Z")) / 864e5;
  return days > C_STALE_DAYS;
}
function cUpside(o, price, priceCurrency) {
  if (o.target_price === null || o.target_price === undefined) return {text: "(ingen riktkurs)", value: null};
  if (o.currency !== priceCurrency) return {text: "(annan valuta)", value: null};
  if (!price) return {text: "(kurs saknas)", value: null};
  return {text: null, value: o.target_price / price - 1};
}
function cValidate(input, existing, opts) {
  const errors = [], warnings = [];
  const today = opts.today, now = opts.now;
  const priceCurrency = opts.priceCurrency;
  const source = input.source;
  if (!source || !C_SOURCES[source] || !C_SOURCES[source].manual) errors.push("Välj källa.");
  if (!cDateOk(input.observed_at)) errors.push("Ange observationsdatum.");
  else if (input.observed_at > today) errors.push("Observationsdatum kan inte vara i framtiden.");
  if (input.source_date) {
    if (!cDateOk(input.source_date)) errors.push("Källans datum är ogiltigt.");
    else if (input.source_date > today) errors.push("Källans datum kan inte vara i framtiden.");
  }
  let horizon = null;
  if (input.horizon_type === "12m") horizon = {type: "12m"};
  else if (input.horizon_type === "fiscal_year") {
    const y = cNum(input.horizon_year);
    if (y === null || !Number.isInteger(y) || y < 2000 || y > 2100) errors.push("Ange räkenskapsår för prognoshorisonten.");
    else horizon = {type: "fiscal_year", year: y};
  } else errors.push("Välj prognoshorisont.");
  const target = cNum(input.target_price);
  if (Number.isNaN(target)) errors.push("Riktkursen är inte ett tal.");
  else if (target !== null && target <= 0) errors.push("Riktkursen måste vara större än noll.");
  const currency = input.currency || null;
  if (target !== null && !Number.isNaN(target) && !C_CURRENCIES.includes(currency)) errors.push("Välj valuta för riktkursen.");
  const count = (value, label) => {
    const n = cNum(value);
    if (Number.isNaN(n)) { errors.push(`${label}: inte ett tal.`); return null; }
    if (n !== null && (!Number.isInteger(n) || n < 0)) { errors.push(`${label}: måste vara ett heltal, minst 0.`); return null; }
    return n;
  };
  const buy = count(input.buy, "Köp"), hold = count(input.hold, "Behåll"), sell = count(input.sell, "Sälj");
  const analysts = count(input.analysts, "Antal analytiker");
  const number = (value, label) => {
    const n = cNum(value);
    if (Number.isNaN(n)) { errors.push(`${label}: inte ett tal.`); return null; }
    return n;
  };
  const revenue = number(input.revenue_m, "Omsättning");
  if (revenue !== null && revenue < 0) errors.push("Omsättning: kan inte vara negativ.");
  const eps = number(input.eps, "EPS");
  const revGrowth = number(input.revenue_growth_pct, "Omsättningstillväxt");
  const earnGrowth = number(input.earnings_growth_pct, "Vinsttillväxt");
  const fy = cNum(input.forecast_year);
  const yearBad = fy !== null && (!Number.isInteger(fy) || fy < 2000 || fy > 2100);
  if (yearBad) errors.push("Prognosåret är ogiltigt.");
  const anyForecast = [revenue, eps, revGrowth, earnGrowth].some(x => x !== null);
  if (anyForecast && fy === null) errors.push("Ange prognosår för prognoserna.");
  const anyRating = [buy, hold, sell, analysts].some(x => x !== null);
  const targetGiven = target !== null && !Number.isNaN(target);
  const rawNumbers = [input.target_price, input.buy, input.hold, input.sell, input.analysts, input.revenue_m, input.eps, input.revenue_growth_pct, input.earnings_growth_pct];
  const anyRaw = rawNumbers.some(x => x !== null && x !== undefined && String(x).trim() !== "");
  if (!targetGiven && !anyRating && !anyForecast && !anyRaw) errors.push("Ange minst en uppgift (riktkurs, rekommendationer eller prognos).");
  if (buy !== null && hold !== null && sell !== null && analysts !== null && buy + hold + sell !== analysts) {
    warnings.push(`Köp + behåll + sälj = ${buy + hold + sell}, men antal analytiker är ${analysts}.`);
  }
  if (targetGiven && currency && priceCurrency && currency !== priceCurrency) {
    warnings.push(`Riktkursen är i ${currency} men aktien handlas i ${priceCurrency}. Uppsida räknas inte.`);
  }
  if (horizon && source && input.observed_at) {
    const key = JSON.stringify(horizon);
    const same = cActive(existing || [], input.ticker).some(o => o.id !== input.supersedes && o.source === source
      && o.observed_at === input.observed_at && JSON.stringify(o.horizon) === key);
    if (same) warnings.push("Det finns redan en observation från samma källa, dag och horisont. Använd Rätta om den förra var fel.");
  }
  const obs = errors.length ? null : {
    id: opts.id || cNewId("c", 4), kind: "observation", ticker: input.ticker, borsdata_id: null, layer: "analyst", source,
    provider: (input.provider || "").trim() || null, method: "manual", recorded_at: now, observed_at: input.observed_at,
    source_date: input.source_date || null, horizon, target_price: target, currency: target === null ? null : currency,
    ratings: {buy, hold, sell}, analysts,
    forecasts: {revenue_m: revenue, eps, revenue_growth_pct: revGrowth, earnings_growth_pct: earnGrowth, year: anyForecast ? fy : null},
    comment: (input.comment || "").trim(), quality: warnings.length ? "warning" : "ok", warnings,
    ai_allowed: input.ai_allowed !== false, supersedes: input.supersedes || null, schema: 1,
  };
  return {obs, errors, warnings};
}
function cRetractionRecord(ticker, id, now, reason, recId) {
  return {id: recId || cNewId("r", 4), kind: "retraction", ticker, retracts: id, recorded_at: now, reason: (reason || "").trim() || "Felregistrering", schema: 1};
}
/* CONSENSUS-LOGIC-END */

const NAMES = {momentum: "Momentum Breakout", pullback: "Pullback", turtle: "Turtle"};
const SHORT_NAMES = {momentum: "Momentum", pullback: "Pullback", turtle: "Turtle"};
const SOURCE_LABELS = {"idé": "Din idé", analytiker: "Analytiker", fundamenta: "Fundamenta"};
const IDEA_SOURCES = ["Affärsvärlden", "Dagens industri", "Aktiespararna", "Privata Affärer", "Placera", "Börsvärlden", "Forum", "ChatGPT", "Egen analys", "Annan"];
const IDEA_ADVICE = ["Köp", "Spekulativt köp", "Öka", "Utdelningsaktie"];
const GITHUB_API = "https://api.github.com";
const CFG_KEY = "screener.cfg", TOKEN_KEY = "screener.token";
const EMPTY = {positions: {open: [], closed: []}, ideas: {ideas: []}, research: {events: [], stocks: {}, candidates: {}}, events: [], watchlist: {entries: []},
  prices: {updated: null, fx: {USDSEK: null}, quotes: {}}, levels: {}, history: [], reports: []};
const FILES = Object.keys(EMPTY);

const S = {cfg: {owner: "", repo: "", branch: "data", fee: 0, remember: true}, token: "", api: GITHUB_API, data: null, tab: "portfolio", histFilter: "all", loading: false, sheet: false, loaded: false, message: ""};

/* ---- Hjälpare ---- */
const $ = id => document.getElementById(id);
function esc(s) { return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c])); }
const NF = {};
function nf(x, d) { d = d === undefined ? 2 : d; if (!NF[d]) NF[d] = new Intl.NumberFormat("sv-SE", {minimumFractionDigits: d, maximumFractionDigits: d}); const t = NF[d].format(x); return /^[−-]0([,.]0*)?$/.test(t) ? t.slice(1) : t; }
function num(x, d) { return x === null || x === undefined || Number.isNaN(x) ? "–" : nf(x, d); }
function signed(x, d) { return (x >= 0 ? "+" : "") + nf(x, d); }
function pct(x, d) { return x === null || x === undefined || !isFinite(x) ? "–" : signed(x * 100, d === undefined ? 1 : d) + " %"; }
function cls(x) { return x > 0 ? "gain" : x < 0 ? "loss" : ""; }
function short(t) { return String(t || "").replace(/\.ST$/i, ""); }
function marketOf(t) { return /\.ST$/i.test(t || "") ? "se" : "us"; }
function curOf(p) { return (p.market || marketOf(p.ticker)) === "us" ? "$" : "kr"; }
function localNow() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }

function dateOf(s) { const d = new Date(s); return isNaN(d) ? String(s || "").slice(0, 10) : new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function timeOf(s) { const d = new Date(s); return isNaN(d) ? "" : new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(11, 16); }
function whenText(s) { if (!s) return "saknas"; const day = dateOf(s); return (day === todayStr() ? "idag " : day + " ") + timeOf(s); }
function dayLabel(day) {
  const today = todayStr();
  const y = new Date(Date.parse(today + "T12:00:00") - 864e5);
  if (day === today) return "Idag";
  if (day === new Date(y - y.getTimezoneOffset() * 60000).toISOString().slice(0, 10)) return "Igår";

}
function toast(msg, isErr) {
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), isErr ? 5000 : 2600);
}

/* ---- Inställningar ---- */
function loadCfg() {
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(CFG_KEY) || "{}") || {}; } catch (e) { stored = {}; }

}
function saveCfg() {

    if (S.cfg.remember && S.token) out.token = S.token;

}
function apiPermitted() {

  return apiOverrideAllowed(S.api, location);
}

/* ---- GitHub-lagring ---- */
function utf8ToB64(text) { const b = new TextEncoder().encode(text); let s = ""; for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192)); return btoa(s); }
function b64ToUtf8(b64) { const s = atob(b64.replace(/\s/g, "")); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return new TextDecoder().decode(b); }
function gh(path, opts) {
  if (!apiPermitted()) throw new Error("Otillåten API-adress");
  opts = opts || {};
  const headers = {Authorization: `Bearer ${S.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"};
  if (opts.body) headers["Content-Type"] = "application/json";
  return fetch(`${S.api}/repos/${encodeURIComponent(S.cfg.owner)}/${encodeURIComponent(S.cfg.repo)}/contents/${path}`, {method: opts.method || "GET", body: opts.body, cache: "no-store", headers});
}
async function getFile(name) {
  const res = await gh(`${name}.json?ref=${encodeURIComponent(S.cfg.branch || "data")}&t=${Date.now()}`);
  if (res.status === 404) return {data: null, missing: true};
  if (res.status === 401 || res.status === 403) throw new Error("Token saknar behörighet. Kontrollera inställningarna.");
  if (!res.ok) throw new Error(`GitHub svarade ${res.status} för ${name}.json`);
  const json = await res.json();
  let text = json.content ? b64ToUtf8(json.content) : "";
  if (!text && json.sha) text = "null";
  return {data: JSON.parse(text), sha: json.sha};
}
async function putFile(name, data, sha, message) {

}
function forgetToken() {
  S.token = ""; S.data = null; S.message = "start";
  try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* inget att ta bort */ }
  saveCfg();
  closeSheet(); render(); toast("Token är borttagen från den här enheten.");
}

/* ---- Aktievy och konsensus ---- */
function cLabels(list, o, today) {
  const out = [], st = cStatus(list, o);
  if (st === "superseded") out.push(`<span class="tag">rättad</span>`);
  if (st === "retracted") out.push(`<span class="tag bad">felregistrerad</span>`);
  if (o.observed_at && cIsStale(o, today)) out.push(`<span class="tag warn">inaktuell</span>`);
  if (o.quality === "warning") out.push(`<span class="tag warn">varning</span>`);
  if (o.ai_allowed === false) out.push(`<span class="tag">ej AI</span>`);
  return out.join("");
}
function cObservationHtml(list, o, ticker, today, withButtons) {
  const price = quote(ticker) ? quote(ticker).price : null, up = cUpside(o, price, cPriceCurrency(ticker));
  const r = o.ratings || {}, f = o.forecasts || {}, src = C_SOURCES[o.source] ? C_SOURCES[o.source].label : o.source;
  const lines = [];
  if (o.target_price !== null && o.target_price !== undefined) lines.push(`Riktkurs ${num(o.target_price)} ${esc(o.currency || "")} ${up.value !== null ? pct(up.value) : esc(up.text)}`);
  if ([r.buy, r.hold, r.sell].some(x => x !== null && x !== undefined)) lines.push(`Köp ${esc(r.buy === null ? "–" : r.buy)} · Behåll ${esc(r.hold === null ? "–" : r.hold)} · Sälj ${esc(r.sell === null ? "–" : r.sell)}`);
  if (o.analysts !== null && o.analysts !== undefined) lines.push(`${esc(o.analysts)} analytiker`);
  const parts = [];
  if (f.revenue_m !== null && f.revenue_m !== undefined) parts.push(`omsättning ${num(f.revenue_m, 0)} M`);
  if (f.eps !== null && f.eps !== undefined) parts.push(`EPS ${num(f.eps)}`);
  if (f.revenue_growth_pct !== null && f.revenue_growth_pct !== undefined) parts.push(`omsättningstillväxt ${num(f.revenue_growth_pct, 1)} %`);
  if (f.earnings_growth_pct !== null && f.earnings_growth_pct !== undefined) parts.push(`vinsttillväxt ${num(f.earnings_growth_pct, 1)} %`);
  if (parts.length) lines.push(`Prognos ${esc(f.year)}: ${parts.join(" · ")}`);
  const horizon = o.horizon && o.horizon.type === "fiscal_year" ? `räkenskapsår ${esc(o.horizon.year)}` : "12 mån";
  const buttons = withButtons && cStatus(list, o) === "active" ? `<div class="actions"><button class="btn" data-act="cfix" data-id="${esc(o.id)}">Rätta</button><button class="btn danger" data-act="cretract" data-id="${esc(o.id)}">Markera som fel</button></div>` : "";
  return `<div class="card" data-obs="${esc(o.id)}"><div><b>${esc(src)}</b>${o.provider ? ` <span class="muted">${esc(o.provider)}</span>` : ""} ${cLabels(list, o, today)}</div>
    ${lines.map(l => `<div class="small">${l}</div>`).join("")}
    <div class="small muted">Gällde ${esc(o.observed_at)}${o.source_date ? `, källans datum ${esc(o.source_date)}` : ""} · registrerad ${esc(dateOf(o.recorded_at))} · ${horizon} · manuell</div>
    ${o.comment ? `<div class="small body">${esc(o.comment)}</div>` : ""}${(o.warnings || []).map(w => `<div class="small hot">${esc(w)}</div>`).join("")}${buttons}</div>`;
}
async function openStock(ticker, name) {
  let list = [];
  try { const file = await getFile("consensus"); list = (file.data && file.data.observations) || []; }
  catch (e) { toast(e.message, true); return; }
  S.stock = {ticker, name, list};
  const today = todayStr(), q = quote(ticker), latest = Object.values(cLatestBySource(list, ticker));
  const fund = S.data.research.stocks[ticker], yc = fund && fund.fund && fund.fund.consensus;
  const yahoo = yc && (yc.target || yc.mean) ? `<div class="card"><div><b>Yahoo</b> <span class="tag">automatisk</span></div><div class="small">Riktkurs ${num(yc.target)}, snittbetyg ${num(yc.mean, 1)} (1 = köp, 5 = sälj), ${esc(yc.n || 0)} analytiker</div><div class="small muted">Hämtad ${esc(dateOf(fund.updated))} · valuta antas vara aktiens · ingår i botens nuvarande regler</div></div>` : "";
  const cur = cPriceCurrency(ticker);
  const targets = latest.filter(o => o.target_price && o.currency === cur).map(o => o.target_price);
  if (yc && yc.target) targets.push(yc.target);
  const differ = targets.length > 1 && (Math.max(...targets) - Math.min(...targets)) / Math.min(...targets) > 0.005;
  const obs = list.filter(o => o.ticker === ticker).slice().sort((a, b) => String(b.recorded_at) < String(a.recorded_at) ? -1 : 1);
  const hist = obs.map(o => o.kind === "retraction" ? `<div class="card small"><b>Felregistrering markerad</b> · ${esc(dateOf(o.recorded_at))} · ${esc(o.reason)}</div>` : cObservationHtml(list, o, ticker, today, true)).join("");
  openSheet(`<h2>${esc(name)} <span class="muted">${esc(short(ticker))}</span></h2><p class="muted">${q ? `Kurs ${num(q.price)} kr, ${esc(whenText(q.time))}` : "Kurs saknas – uppsida kan inte räknas."}</p>
    <div class="actions"><button class="btn" data-act="addcons" data-t="${esc(ticker)}" data-n="${esc(name)}">+ Lägg till konsensus</button><button class="btn ghost" data-act="close">Stäng</button></div>
    <h2 id="sec-analyst">Analytikerkonsensus</h2>${latest.map(o => cObservationHtml(list, o, ticker, today, false)).join("")}${yahoo}${!latest.length && !yahoo ? `<p class="muted">Ingen analytikerkonsensus registrerad.</p>` : ""}${differ ? `<p class="hint">Källorna anger olika riktkurser. De visas separat och slås inte ihop.</p>` : ""}
    <h2 id="sec-users">Användarkonsensus – Börsdata</h2><p class="muted small">Inte professionell analytikerkonsensus: snittet av Börsdata-användarnas egna estimat.</p><p class="muted small">Inga ögonblicksbilder än. De hämtas nattligt när det steget är godkänt och infört.</p>
    <h2 id="sec-own">LaMachinas egen värdering</h2><p class="muted small">Ej analyserad</p>
    <details id="cHistory"><summary>Konsensushistorik (${obs.length} poster)</summary>${hist}</details>`);
}
function consensusFormHtml(ticker, name, base) {
  const fix = !!base, b = base || {}, r = b.ratings || {}, f = b.forecasts || {}, cur = b.currency || cPriceCurrency(ticker), h = b.horizon || {type: "12m"};
  const val = x => x === null || x === undefined ? "" : esc(x);
  return `<form id="consForm" autocomplete="off" novalidate><h2>${fix ? "Rätta" : "Lägg till"} analytikerkonsensus</h2><p class="muted">${fix ? "Den gamla observationen sparas och märks som rättad." : "Uppgifter du själv läst av. Lämna tomt det som inte anges av källan."}</p><p><b>${esc(name)}</b> <span class="muted">${esc(short(ticker))}</span></p>
    <label>Källa</label>${choices("source", Object.entries(C_SOURCES).filter(([, x]) => x.manual).map(([k, x]) => [k, x.label]), b.source || "")}
    <label for="k-provider">Ursprunglig leverantör (valfritt)</label><input id="k-provider" type="text" name="provider" value="${val(b.provider)}">
    <div class="grid2"><div><label for="k-obs">Observationsdatum</label><input id="k-obs" type="date" name="observed_at" value="${esc(b.observed_at || todayStr())}"></div><div><label for="k-src">Källans datum (valfritt)</label><input id="k-src" type="date" name="source_date" value="${val(b.source_date)}"></div></div>
    <label>Prognoshorisont</label>${choices("horizon_type", [["12m", "12 månader (riktkurs)"], ["fiscal_year", "Räkenskapsår"]], h.type)}<label for="k-year">Räkenskapsår</label><input id="k-year" type="text" inputmode="numeric" name="horizon_year" value="${val(h.year)}">
    <h3>Analytikerrekommendationer</h3><div class="grid2"><div><label for="k-target">Genomsnittlig riktkurs</label><input id="k-target" type="text" inputmode="decimal" name="target_price" value="${val(b.target_price)}"></div><div><label for="k-cur">Valuta</label><select id="k-cur" name="currency">${C_CURRENCIES.map(c => `<option${c === cur ? " selected" : ""}>${c}</option>`).join("")}</select></div></div>
    <div class="grid3"><div><label for="k-buy">Köp</label><input id="k-buy" type="text" inputmode="numeric" name="buy" value="${val(r.buy)}"></div><div><label for="k-hold">Behåll</label><input id="k-hold" type="text" inputmode="numeric" name="hold" value="${val(r.hold)}"></div><div><label for="k-sell">Sälj</label><input id="k-sell" type="text" inputmode="numeric" name="sell" value="${val(r.sell)}"></div></div>
    <label for="k-n">Antal analytiker (om källan anger det)</label><input id="k-n" type="text" inputmode="numeric" name="analysts" value="${val(b.analysts)}">
    <details><summary>Valfria prognoser</summary><div class="grid2"><div><label for="k-rev">Omsättning (M)</label><input id="k-rev" type="text" inputmode="decimal" name="revenue_m" value="${val(f.revenue_m)}"></div><div><label for="k-eps">EPS</label><input id="k-eps" type="text" inputmode="decimal" name="eps" value="${val(f.eps)}"></div><div><label for="k-rg">Omsättningstillväxt (%)</label><input id="k-rg" type="text" inputmode="decimal" name="revenue_growth_pct" value="${val(f.revenue_growth_pct)}"></div><div><label for="k-eg">Vinsttillväxt (%)</label><input id="k-eg" type="text" inputmode="decimal" name="earnings_growth_pct" value="${val(f.earnings_growth_pct)}"></div><div><label for="k-fy">Prognosår</label><input id="k-fy" type="text" inputmode="numeric" name="forecast_year" value="${val(f.year)}"></div></div></details>
    <label for="k-comment">Kommentar</label><textarea id="k-comment" name="comment">${esc(b.comment || "")}</textarea>
    <label class="check"><input type="checkbox" name="ai_allowed"${b.ai_allowed === false ? "" : " checked"}> Får användas i LaMachinas privata AI-analys</label>
    <div id="consErr" class="error" role="alert"></div><div id="consWarn" class="warning"></div>
    <div class="actions"><button class="btn primary" type="submit" id="consSave">Spara</button><button class="btn ghost" type="button" data-act="close">Avbryt</button></div></form>`;
}
function openConsensus(ticker, name, base) {
  S.cons = {ticker, name, supersedes: base ? base.id : null, confirmed: false};
  openSheet(consensusFormHtml(ticker, name, base));
}
async function saveConsensusForm(form) {
  const c = S.cons, v = formValues(form);
  let existing = [];
  const file = await getFile("consensus");
  existing = (file.data && file.data.observations) || [];
  const input = Object.assign({}, v, {ticker: c.ticker, supersedes: c.supersedes, ai_allowed: form.elements.ai_allowed.checked});
  const res = cValidate(input, existing, {today: todayStr(), now: isoNow(), priceCurrency: cPriceCurrency(c.ticker)});
  $("consErr").textContent = res.errors.join(" ");
  $("consWarn").textContent = res.warnings.join(" ");
  if (res.errors.length) { c.confirmed = false; $("consSave").textContent = "Spara"; return; }
  if (res.warnings.length && !c.confirmed) { c.confirmed = true; $("consSave").textContent = "Spara ändå"; return; }
  const sourceLabel = C_SOURCES[res.obs.source].label;
  await saveConsensus(res.obs, `Konsensus ${c.ticker} (${sourceLabel})`);
  toast("Konsensus är sparad.");
  closeSheet();
  await openStock(c.ticker, c.name);
}
async function saveConsensus(rec, message) {
  await mutateFile("consensus", f => {
    const file = f && f.observations ? f : {schema: 1, observations: []};
    const before = structuredClone(file.observations);
    const after = cAppend(file.observations, rec);
    if (!cUnchangedPrefix(before, after)) throw new Error("Avbrutet: befintlig konsensushistorik skulle ha ändrats.");
    return {schema: 1, observations: after};
  }, message);
}
async function retractObservation(id) {
  const {ticker, name} = S.stock;
  const reason = window.prompt("Varför är observationen fel? (valfritt)", "");
  if (reason === null) return;
  await saveConsensus(cRetractionRecord(ticker, id, isoNow(), reason), `Konsensus ${ticker}: felregistrering`);
  toast("Observationen är markerad som fel.");
  closeSheet();
  await openStock(ticker, name);
}

/* ---- Händelser ---- */
const ACTIONS = {
  tab: el => { S.tab = el.dataset.tab; render(); window.scrollTo(0, 0); },
  refresh: () => refresh(),
  settings: () => openSettings(),
  close: () => closeSheet(),
  histfilter: el => { S.histFilter = el.dataset.f; render(); },
  newbuy: () => openBuy({}),
  newidea: () => openIdea(),
  forget: () => forgetToken(),
  sell: el => { const p = S.data.positions.open.find(x => x.id === el.dataset.id); if (p) openSell(p, el.dataset.price); },
  sellall: el => { $("s-qty").value = el.dataset.q; updateSellPreview(); },
  buymore: el => { const p = S.data.positions.open.find(x => x.id === el.dataset.id); if (p) openBuy({pos: p}); },
  edit: el => { const p = S.data.positions.open.find(x => x.id === el.dataset.id); if (p) openEdit(p); },
  delete: async () => {
    if (!window.confirm("Ta bort registreringen? Använd bara om köpet registrerades av misstag.")) return;
    const p0 = S.edit;
    await mutateFile("positions", f => { f.open = f.open.filter(x => x.id !== p0.id); return f; }, `Ta bort ${p0.ticker}`);
    closeSheet(); render(); toast("Registreringen är borttagen.");
  },
  sigbuy: el => { const e = S.data.events.find(x => x.id === el.dataset.ev); if (e) openBuy({ticker: e.ticker, name: e.name, market: e.market, price: e.price, strategy: e.strategy, stop: e.stop, target: e.target, atr: e.atr, qty: e.qty, event: e.id, source: (e.sources || []).join(",")}); },
  sigadd: el => { const e = S.data.events.find(x => x.id === el.dataset.ev); const p = e && S.data.positions.open.find(x => x.id === e.pos_id); if (p) openBuy({pos: p, price: e.price, event: e.id}); },
  archive: async el => {
    if (!window.confirm("Arkivera idén?")) return;
    const idea = S.data.ideas.ideas.find(i => i.id === el.dataset.id);
    await mutateFile("ideas", f => { const i = f.ideas.find(x => x.id === el.dataset.id); if (i) i.status = "archived"; return f; }, `Arkivera idé ${idea ? idea.ticker : ""}`);
    render(); toast("Idén är arkiverad.");
  },
  stock: el => openStock(el.dataset.t, el.dataset.n),
  addcons: el => openConsensus(el.dataset.t, el.dataset.n),
  cfix: async el => {
    const {ticker, name} = S.stock;
    const file = await getFile("consensus");
    const list = (file.data && file.data.observations) || [];
    const problem = cCheckAmend(list, el.dataset.id);
    if (problem) { toast(problem, true); closeSheet(); await openStock(ticker, name); return; }
    openConsensus(ticker, name, list.find(o => o.id === el.dataset.id));
  },
  cretract: el => retractObservation(el.dataset.id),
};
document.addEventListener("click", ev => {
  if (ev.target.id === "scrim") { closeSheet(); return; }
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  ev.preventDefault();
  Promise.resolve().then(() => fn(el)).catch(e => { toast(e.message, true); handleSaveError(e); });
});
function handleSaveError(e) {
  if (S.stock && $("scrim") && /Öppna aktien igen/.test(e.message)) {
    const {ticker, name} = S.stock;
    closeSheet();
    openStock(ticker, name);
  }
}
const FORMS = {buyForm: saveBuy, sellForm: saveSell, editForm: saveEdit, ideaForm: saveIdea, cfgForm: saveSettings, consForm: saveConsensusForm};
document.addEventListener("submit", ev => {
  ev.preventDefault();
  const fn = FORMS[ev.target.id];
  if (!fn) return;
  Promise.resolve().then(() => fn(ev.target)).catch(e => {
    toast(e.message, true);
    handleSaveError(e);
  });
});
document.addEventListener("input", ev => {
  const form = ev.target.form;
  if (!form) return;
  if (form.id === "buyForm") {
    updateBuyPreview();
    if (ev.target.name === "ticker" || ev.target.name === "market") { S.tickerOk = null; $("buyMsg").textContent = ""; $("buySave").textContent = "Spara"; }
  }
  if (form.id === "sellForm") updateSellPreview();
  if (form.id === "consForm" && S.cons) { S.cons.confirmed = false; $("consSave").textContent = "Spara"; $("consWarn").textContent = ""; }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && S.sheet) closeSheet(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !S.sheet && S.data) refresh(); });

/* ---- Djuplänkar ---- */
let pendingLink = null;
function readDeepLink() {
  const q = new URLSearchParams(location.search);
  const out = {};
  ["buy", "buymore", "sell", "tab", "name", "price", "strategy", "stop", "target", "atr", "qty", "event", "source"].forEach(k => { if (q.has(k)) out[k] = q.get(k); });
  if (Object.keys(out).length) {
    const keep = new URLSearchParams();
    if (q.has("api")) keep.set("api", q.get("api"));
    const rest = keep.toString();
    history.replaceState(null, "", location.pathname + (rest ? "?" + rest : ""));
    return out;
  }
  return null;
}
async function runDeepLink() {
  const l = pendingLink;
  if (!l || !S.data) return;
  pendingLink = null;
  if (["portfolio", "signals", "watch", "history"].includes(l.tab)) { S.tab = l.tab; render(); }
  if (l.buy) {
    const m = marketOf(l.buy);
    openBuy({ticker: l.buy, market: m, name: l.name, price: l.price, strategy: l.strategy, stop: l.stop, target: l.target, atr: l.atr, qty: l.qty, event: l.event, source: l.source});
  } else if (l.buymore) {
    const p = S.data.positions.open.find(x => x.id === l.buymore);
    if (!p) { toast("Innehavet finns inte längre.", true); return; }
    const ev = S.data.events.find(e => e.add && e.pos_id === p.id && !isRegistered(e));
    openBuy({pos: p, price: l.price, qty: l.qty, event: ev ? ev.id : null});
  } else if (l.sell) {
    const p = S.data.positions.open.find(x => x.id === l.sell);
    if (!p) { toast("Innehavet finns inte längre.", true); return; }
    openSell(p, l.price);
  }
}
async function start() {
  loadCfg();
  pendingLink = readDeepLink();
  render();
  if (!S.cfg.owner || !S.cfg.repo || !S.token) {
    if (pendingLink) openSettings();
    return;
  }
  await refresh();
  await runDeepLink();
}
start();
</script>
